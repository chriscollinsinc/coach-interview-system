<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CCI Staff Interviews</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CCI Interviews">
  <meta name="theme-color" content="#0D0D0D" id="themeColor">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script>
    // Runs before the stylesheet paints: no flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem('cci.theme');
        if (t === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          var m = document.querySelector('meta[name=theme-color]');
          if (m) m.setAttribute('content', '#F2F2F2');
        }
      } catch (e) { /* private mode or blocked storage: dark is the default */ }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="backBtn" hidden>&lsaquo; Back</button>
    <span class="brandmark" id="brandmark">
      <img src="/icons/cci-logo.png" alt="Chris Collins Inc.">
    </span>
    <h1 id="title">Staff Interviews</h1>
    <span class="netpill online" id="net">online</span>
    <button class="themetoggle" id="themeBtn" title="Switch theme" aria-label="Switch between dark and light">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
    <button class="btn ghost small" id="logoutBtn" hidden>Sign out</button>
  </header>
  <main id="app"><p class="muted">Loading…</p></main>
  <script src="/app.js"></script>
</body>
</html>
