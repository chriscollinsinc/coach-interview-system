services:
  - type: web
    name: cci-staff-interviews
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cci-interviews-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5

databases:
  - name: cci-interviews-db
    plan: basic-256mb
    postgresMajorVersion: "16"
